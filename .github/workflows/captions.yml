name: Build video words
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/captions.yml']
permissions:
  contents: write
concurrency:
  group: captions
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U yt-dlp janome
      - name: Fetch subtitles and split into words
        run: python scripts/build_captions.py
        env:
          BUDGET: '150'
      - name: Save results
        run: |
          git config user.name "hibiki-bot"
          git config user.email "hibiki-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Update video words ($(date -u +%F))"
          git pull --rebase origin main
          git push
