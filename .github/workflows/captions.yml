name: Build video words
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/captions.yml']
permissions:
  contents: write
concurrency:
  group: captions
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U yt-dlp janome youtube-transcript-api
      - name: Fetch subtitles and split into words
        run: python scripts/build_captions.py
        env:
          BUDGET: '250'
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install faster-whisper
      - name: Make subtitles for Niconico videos (Whisper)
        run: python scripts/nico_whisper.py
        continue-on-error: true
        env:
          MINUTES: '40'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save results
        if: always()
        run: |
          git config user.name "hibiki-bot"
          git config user.email "hibiki-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Update video words ($(date -u +%F))"
          git pull --rebase origin main
          git push
