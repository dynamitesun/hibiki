<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Hibiki — Learn Japanese from YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f0e4;--card:#fffaf0;--ink:#1f1b16;--muted:#7a6e5e;--line:#e5dac6;--red:#c63d2b;--red-soft:#f6ddd5;--gold:#b8892a;--gold-soft:#f5e6bf;--green:#3f7d4e;--shadow:0 1px 0 rgba(60,40,10,.05),0 6px 18px -8px rgba(60,40,10,.18)}
@media (prefers-color-scheme:dark){:root{--paper:#15120e;--card:#201c17;--ink:#f2eadc;--muted:#a69a87;--line:#352e25;--red:#e2604c;--red-soft:#3a201a;--gold:#d8aa4a;--gold-soft:#3a2f17;--green:#79b884;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Zen Kaku Gothic New',system-ui,sans-serif;font-size:16px;line-height:1.45}
.jp{font-family:'Klee One','Hiragino Mincho ProN',serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
textarea{min-height:120px;resize:vertical;font-size:14px}
input:focus,textarea:focus{border-color:var(--gold)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
a{color:var(--red)}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:22px}
.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.wide{width:100%;padding:15px}
.btn:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.feed{display:grid;gap:14px}
.vid{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.thumb{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.thumb .play{position:absolute;left:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);color:#1f1b16;display:grid;place-items:center}
.thumb .tag{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.vid .meta{padding:12px 16px 14px}
.lv{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500;position:relative}
nav.tabs .ic{font-size:21px;line-height:1.1;font-family:'Klee One',serif}
nav.tabs button.on{color:var(--red)}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--red);color:#fff}
.ov{position:fixed;inset:0;background:var(--paper);z-index:20;display:none;overflow-y:auto}
.ov.open{display:block}
.ov-in{max-width:560px;margin:0 auto;padding:10px 0 40px}
.ov-top{display:flex;align-items:center;gap:10px;padding:0 14px 10px}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px;flex:none}
.vwrap{position:sticky;top:0;z-index:2;background:#000;aspect-ratio:16/9}
.vwrap iframe,.vwrap>div{position:absolute;inset:0;width:100%;height:100%}
.pad{padding:0 14px}
.capbox{margin-top:12px;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);min-height:110px}
.capbox .who{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.jpl{font-size:25px;line-height:1.95;font-family:'Klee One',serif;word-break:break-all}
.enl{color:var(--muted);font-size:15px;margin-top:4px}
.nofuri rt{visibility:hidden}.noen .enl{display:none}
rt{font-size:.45em;color:var(--muted);font-family:'Zen Kaku Gothic New',sans-serif}
.tok{border-radius:8px;padding:0 1px;transition:background .12s,color .12s}
.tok.w{cursor:pointer}
.tok.saved{text-decoration:underline dotted var(--gold);text-underline-offset:6px;text-decoration-thickness:2px}
.tok.cur{background:var(--gold-soft);color:var(--red)}
.tok.hid rt{visibility:hidden}
.ctrls{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 6px}
.cb{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px;display:grid;place-items:center}
.cb.main{width:58px;height:58px;background:var(--red);border-color:var(--red);color:#fff;font-size:20px}
.toggles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tg{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--muted)}
.tg.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.trans{display:grid;gap:4px;margin-top:6px}
.tl{display:flex;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:14px;border:1px solid transparent}
.tl.on{background:var(--card);border-color:var(--line)}
.tl .ts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px;min-width:38px}
.tl .j{font-family:'Klee One',serif;font-size:17px}.tl .e{font-size:13px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.wbig{font-size:44px;font-family:'Klee One',serif;line-height:1.6}.wbig rt{font-size:.38em}
.pos{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.fact{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--paper);border-radius:12px;border:1px solid var(--line);margin-top:8px}
.fact span:first-child{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding-top:3px}
.kchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kchip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:13px;text-align:left}
.kchip b{font-family:'Klee One',serif;font-size:22px;width:32px;height:32px;display:grid;place-items:center;background:var(--card);border-radius:8px;font-weight:600}
.fam{margin-bottom:12px}.fam-h{display:flex;align-items:center;gap:14px}
.fam-k{font-family:'Klee One',serif;font-size:42px;width:62px;height:62px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.wrow:first-child{border-top:0}
.wrow .w{font-family:'Klee One',serif;font-size:22px;line-height:1.7;min-width:80px}.wrow .w rt{font-size:.45em}
.wrow .src{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seeds{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:26px 14px}.empty .jp{font-size:52px;color:var(--gold)}
.rv-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);text-align:center;margin-top:12px}
.rv-word{font-size:52px;font-family:'Klee One',serif;line-height:1.5}.rv-word rt{font-size:.36em}
.rv-ctx{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--paper);text-align:left}
.rv-ctx .jpl{font-size:20px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades button{padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.grades button small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.grades .ag{color:var(--red)}.grades .gd{color:var(--green)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px}.stat small{color:var(--muted);font-size:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:0}
.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}.switch.on::after{left:23px}
.lvpick{display:grid;gap:10px}
.lvopt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);width:100%}
.lvopt.on{border-color:var(--red);background:var(--red-soft)}
.lvopt .k{font-family:'Klee One',serif;font-size:30px;width:48px;text-align:center}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px}.steps li{margin:4px 0}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="ov" id="player"><div class="ov-in" id="pbody"></div></div>
<div class="ov" id="review"><div class="ov-in" id="rbody"></div></div>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
/* ================= basics ================= */
const LEVELS=[{n:'Beginner',d:'Slow, simple speech (around N5)',k:'初'},{n:'Intermediate',d:'Everyday conversations (N4–N3)',k:'中'},{n:'Advanced',d:'Natural, fast speech (N2+)',k:'上'}];
const KEY='hibiki-yt-v1';
let S={level:null,videos:[],saved:{},furi:true,en:true,rate:1,reviews:0};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S={...S,...s}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage full?')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
const isK=c=>/[一-鿿々〆]/.test(c);
const toHira=s=>String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const fmt=t=>{t=Math.max(0,Math.floor(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const vById=id=>S.videos.find(v=>v.id===id);

/* ================= tokenizer (kuromoji, in a background worker so the page never freezes) ================= */
const TK_URL='https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js',TK_DIC='https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/';
let tkState='loading',TKW=null;const TOKCACHE=new Map(),TKPEND=new Set();let tkBatch=[],tkTimer=null;
function startTokenizer(){
  if(TKW||tkState==='failed')return;
  const src=`let tk=null,q=[];
try{importScripts(${JSON.stringify(TK_URL)});
kuromoji.builder({dicPath:${JSON.stringify(TK_DIC)}}).build(function(e,t){if(e){postMessage({type:'fail',err:String(e)});return}tk=t;postMessage({type:'ready'});q.forEach(run);q=[]});
}catch(e){postMessage({type:'fail',err:String(e)})}
function run(texts){postMessage({type:'tok',texts:texts,res:texts.map(function(x){return tk.tokenize(x).map(function(t){return{surface_form:t.surface_form,reading:t.reading,basic_form:t.basic_form,pos:t.pos,pos_detail_1:t.pos_detail_1}})})})}
onmessage=function(e){tk?run(e.data):q.push(e.data)};`;
  try{
    TKW=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    TKW.onmessage=e=>{
      const d=e.data;
      if(d.type==='ready'){tkState='ready';refreshTk()}
      else if(d.type==='fail'){tkState='failed';console.warn('tokenizer',d.err);refreshTk()}
      else if(d.type==='tok'){d.texts.forEach((x,i)=>{TOKCACHE.set(x,processRaw(d.res[i]));TKPEND.delete(x)});tokUpdated()}
    };
    TKW.onerror=e=>{tkState='failed';refreshTk()};
  }catch(e){tkState='failed'}
}
function requestTok(texts){
  if(tkState==='failed')return;startTokenizer();
  texts.forEach(x=>{if(x&&!TOKCACHE.has(x)&&!TKPEND.has(x)){TKPEND.add(x);tkBatch.push(x)}});
  if(tkBatch.length&&!tkTimer)tkTimer=setTimeout(()=>{tkTimer=null;const b=tkBatch;tkBatch=[];if(TKW&&b.length)TKW.postMessage(b)},0);
}
let tokUpdT=null;
function tokUpdated(){clearTimeout(tokUpdT);tokUpdT=setTimeout(()=>{if(P)renderCaption(true);else if(R&&$('#rcard'))renderReview()},30)}
function refreshTk(){const el=$('#tkstatus');if(el)el.outerHTML=tkStatus()}
function tkStatus(){return `<div class="status" id="tkstatus"><span class="dot ${tkState==='ready'?'ok':tkState==='failed'?'bad':''}"></span>${tkState==='ready'?'Word splitter ready':tkState==='failed'?'Word splitter unavailable — basic mode':'Loading word splitter in the background…'}</div>`}
const POS={'名詞':'noun','動詞':'verb','形容詞':'i-adjective','副詞':'adverb','助詞':'particle','助動詞':'auxiliary','連体詞':'pre-noun adjectival','接続詞':'conjunction','感動詞':'interjection','接頭詞':'prefix','フィラー':'filler','記号':'symbol'};
const GLOSS={'は':'topic marker','が':'subject marker; but','を':'object marker','に':'at, to, in (time / place / target)','で':'at, by, with (place / means)','の':"'s, of; (nominalizer)",'も':'also, too','と':'and, with; (quotation)','から':'because; from','まで':'until, up to','へ':'toward','や':'and (non-exhaustive list)','か':'(question marker); or','ね':'right? (seeks agreement)','よ':'(emphasis — "I tell you")','な':'(links na-adjective); don\'t (prohibition)','けど':'but, though','って':'(quotation) — "that…"','ので':'so, because','のに':'even though','だ':'is (plain copula)','です':'is, am, are (polite)','ます':'(polite verb ending)','た':'(past tense)','ない':'not (negative)','たい':'want to','て':'(and / connective form)','でも':'but; even','ぐらい':'about, around','くらい':'about, around','だけ':'only','より':'than; from','ばかり':'only, just'};
function processRaw(raw){
  const out=[];
  raw.forEach(t=>{
    const r=t.reading&&t.reading!=='*'?toHira(t.reading):'';
    const base=t.basic_form&&t.basic_form!=='*'?t.basic_form:t.surface_form;
    const prev=out[out.length-1];
    const attach=prev&&!prev.punct&&['verb','i-adjective'].includes(prev.headPos)&&(t.pos==='助動詞'||(t.pos==='動詞'&&['非自立','接尾'].includes(t.pos_detail_1))||(t.pos==='助詞'&&t.pos_detail_1==='接続助詞'&&['て','で','ちゃ','じゃ'].includes(t.surface_form))||(t.pos==='形容詞'&&t.pos_detail_1==='非自立'));
    if(attach){prev.s+=t.surface_form;prev.r+=(r||toHira(t.surface_form));return}
    let p=POS[t.pos]||t.pos;if(t.pos==='名詞'&&t.pos_detail_1==='形容動詞語幹')p='na-adjective';if(t.pos==='名詞'&&t.pos_detail_1==='固有名詞')p='proper noun';
    out.push({s:t.surface_form,r:r||toHira(t.surface_form),l:base,p,headPos:p,punct:t.pos==='記号'||/^\s+$/.test(t.surface_form)});
  });
  return addPos(out);
}
function addPos(out){let pos=0;out.forEach(t=>{t.start=pos;pos+=t.s.length;t.end=pos});return out}
const BASIC=new Map();
function tokenize(text){
  if(TOKCACHE.has(text))return TOKCACHE.get(text);
  requestTok([text]);
  if(!BASIC.has(text))BASIC.set(text,addPos((text.match(/[\u4e00-\u9fff々〆]+[\u3041-\u3096]*|[\u3041-\u3096ー]+|[\u30a1-\u30faー]+|[A-Za-z0-9]+|\s+|./g)||[]).map(s=>({s,r:'',l:s,p:'',punct:/^[\s。、！？!?.,「」『』（）()…・〜~♪]+$/.test(s)}))));
  return BASIC.get(text);
}
function furi(s,r){
  if(!r||!isK(s)||toHira(s)===r)return esc(s);
  const runs=s.match(/[一-鿿々〆]+|[^一-鿿々〆]+/g);
  try{
    const re=new RegExp('^'+runs.map(x=>isK(x[0])?'(.+?)':toHira(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('')+'$');
    const m=toHira(r).match(re);
    if(m){let g=1;return runs.map(x=>isK(x[0])?`<ruby>${esc(x)}<rt>${m[g++]}</rt></ruby>`:esc(x)).join('')}
  }catch(e){}
  return `<ruby>${esc(s)}<rt>${esc(r)}</rt></ruby>`;
}
const SHOWN=new Map();const shownToks=(vid,ci)=>SHOWN.get(vid+':'+ci)||tokenize(vById(vid).cues[ci].jp);
function lineHTML(vid,ci,opt={}){
  const cue=vById(vid).cues[ci],toks=tokenize(cue.jp);SHOWN.set(vid+':'+ci,toks);
  return toks.map((t,ti)=>{
    if(t.punct)return `<span class="tok p">${esc(t.s)}</span>`;
    const c=['tok','w'];if(S.saved[t.l])c.push('saved');if(opt.mark===t.l)c.push('cur','mk');if(opt.hide===t.l)c.push('hid');
    return `<span class="${c.join(' ')}" data-act="word" data-v="${vid}" data-c="${ci}" data-t="${ti}">${furi(t.s,t.r)}</span>`;
  }).join('');
}

/* ================= transcript parsing ================= */
function ts2s(h,m,s,ms){return (+h||0)*3600+(+m||0)*60+(+s||0)+(ms?+('0.'+ms):0)}
function parseTranscript(txt){
  txt=(txt||'').replace(/\r/g,'').trim();if(!txt)return[];
  const cues=[];
  if(/-->/.test(txt)){ // SRT / VTT
    txt.split(/\n\s*\n/).forEach(b=>{
      const ls=b.split('\n');const i=ls.findIndex(l=>l.includes('-->'));if(i<0)return;
      const m=ls[i].match(/(?:(\d+):)?(\d{1,2}):(\d{2})[.,](\d+)\s*-->\s*(?:(\d+):)?(\d{1,2}):(\d{2})[.,](\d+)/);if(!m)return;
      const jp=ls.slice(i+1).join(' ').replace(/<[^>]+>/g,'').replace(/\{[^}]*\}/g,'').trim();
      if(jp)cues.push({s:ts2s(m[1],m[2],m[3],m[4]),e:ts2s(m[5],m[6],m[7],m[8]),jp});
    });
  }else{ // YouTube "Show transcript" copy: timestamps with text on same or following lines
    let cur=null;
    txt.split('\n').forEach(l=>{
      l=l.trim();if(!l)return;
      if(/^\d+\s*(秒|分|時間|seconds?|minutes?|hours?)([,、\s]+\d+\s*(秒|分|seconds?|minutes?))*$/i.test(l))return; // accessibility duplicates
      const m=l.match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,](\d+))?\s*(.*)$/);
      if(m){cur={s:ts2s(m[1],m[2],m[3],m[4]),jp:m[5]||''};cues.push(cur)}
      else if(cur)cur.jp+=(cur.jp?' ':'')+l;
    });
  }
  const out=cues.map(c=>({...c,jp:c.jp.replace(/\[[^\]]*\]|［[^］]*］/g,'').replace(/\s+/g,' ').trim()})).filter(c=>c.jp).sort((a,b)=>a.s-b.s);
  out.forEach((c,i)=>{const n=out[i+1];if(!c.e||c.e<=c.s)c.e=n?n.s:c.s+4;if(n&&c.e>n.s+.5)c.e=n.s});
  return out;
}
function alignEnglish(cues,en){
  if(!en.length)return;
  cues.forEach(c=>{
    let best=null,bo=0;
    en.forEach(x=>{const o=Math.min(c.e,x.e)-Math.max(c.s,x.s);if(o>bo){bo=o;best=x}});
    if(!best){best=en.reduce((a,x)=>Math.abs(x.s-c.s)<Math.abs(a.s-c.s)?x:a,en[0]);if(Math.abs(best.s-c.s)>2)best=null}
    if(best)c.en=best.jp;
  });
}
function ytId(u){
  u=(u||'').trim();if(/^[\w-]{11}$/.test(u))return u;
  const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:null;
}

  ${gloss?`<div style="font-size:19px;font-weight:700;margin-top:10px">${esc(gloss)}</div>`:''}
  ${t.r&&t.r!==t.s?`<div class="fact"><span>Reading</span><span class="jp" style="font-size:18px">${esc(t.r)}</span></div>`:''}
  ${t.l!==t.s?`<div class="fact"><span>Dictionary form</span><span class="jp" style="font-size:18px">${esc(t.l)}</span></div>`:''}
  <a class="btn wide" style="margin-top:10px;text-decoration:none;color:var(--ink)" href="https://jisho.org/search/${encodeURIComponent(t.l)}" target="_blank" rel="noopener">📖 Look up “${esc(t.l)}” on Jisho ↗</a>
  ${kanji.length?`<div class="kchips">${kanji.map(k=>`<a class="kchip" style="text-decoration:none;color:var(--ink)" href="https://jisho.org/search/${encodeURIComponent(k)}%20%23kanji" target="_blank" rel="noopener"><b>${k}</b>kanji ↗</a>`).join('')}</div>`:''}
  ${fam.length?`<div class="fact" style="display:block"><span style="display:block">Family you're building</span>${fam.map(([k,ws])=>`<div style="margin-top:4px"><b class="jp">${k}</b> → <span class="jp">${ws.map(w=>esc(w.s)).join('、')}</span></div>`).join('')}</div>`:''}
  <label>Meaning (your note)</label><input id="w-note" value="${esc(sv?sv.note:'')}" placeholder="e.g. to eat — from Jisho">
  <button class="btn ${sv?'':'primary'} wide" style="margin-top:12px" data-act="savew" data-v="${vid}" data-c="${ci}" data-t="${ti}">${sv?'Update note':'＋ Save word'}</button>
  ${sv?`<button class="btn wide" style="margin-top:8px;color:var(--red)" data-act="unsave" data-k="${esc(t.l)}">Remove from my words</button>`:''}
  ${P?`<button class="btn wide" style="margin-top:8px" data-act="resume">Resume video</button>`:''}`);
}
function saveWord(vid,ci,ti){
  const v=vById(vid),cue=v.cues[ci],t=shownToks(vid,ci)[ti],note=$('#w-note').value.trim();
  if(S.saved[t.l]){S.saved[t.l].note=note;save();toast('Note updated');closeSheet();return}
  S.saved[t.l]={s:t.s,r:t.r,l:t.l,p:t.p,note,vid,ci,t0:cue.s,t1:cue.e,line:cue.jp,en:cue.en||'',added:Date.now(),lvl:0,due:Date.now()};
  const grew=[...new Set([...t.l].filter(isK))].find(k=>Object.values(S.saved).filter(w=>w.l.includes(k)).length===2);
  save();toast(grew?`New kanji family: ${grew} 🎉`:'Saved — it\'ll come back in Review');closeSheet();
  if(P)renderCaption(true);
}
function savedSheet(k){
  const w=S.saved[k];if(!w)return;
  openSheet(`<div class="wbig">${furi(w.s,w.r)}</div>${w.p?`<span class="pos">${esc(w.p)}</span>`:''}
  <div style="font-size:19px;font-weight:700;margin-top:10px">${esc(w.note||GLOSS[w.l]||'No note yet')}</div>
  ${w.l!==w.s?`<div class="fact"><span>Dictionary form</span><span class="jp" style="font-size:18px">${esc(w.l)}</span></div>`:''}
  <div class="fact" style="display:block"><span style="display:block">Heard in</span><div class="jp" style="font-size:17px;margin-top:4px">${esc(w.line)}</div>${w.en?`<div class="muted" style="font-size:14px">${esc(w.en)}</div>`:''}</div>
  <a class="btn wide" style="margin-top:10px;text-decoration:none;color:var(--ink)" href="https://jisho.org/search/${encodeURIComponent(w.l)}" target="_blank" rel="noopener">📖 Jisho ↗</a>
  ${vById(w.vid)?`<button class="btn primary wide" style="margin-top:8px" data-act="watchat" data-v="${w.vid}" data-t="${w.t0}">▶ Watch it in context</button>`:''}
  <button class="btn wide" style="margin-top:8px;color:var(--red)" data-act="unsave" data-k="${esc(w.l)}">Remove</button>`);
}

/* ================= review with clip replay ================= */
const IV=[10/60,4,24,72,168,336,720,2160,4320];
let R=null,RP=null;
function startReview(){const q=due().sort(()=>Math.random()-.5);if(!q.length)return;R={q,i:0,shown:false,n:q.length};$('#review').classList.add('open');document.body.style.overflow='hidden';renderReview()}
function closeReview(){try{RP&&RP.destroy()}catch(e){}RP=null;R=null;$('#review').classList.remove('open');document.body.style.overflow='';render()}
function nextLvl(w,g){return Math.min(8,g==='again'?0:g==='hard'?Math.max(1,w.lvl):g==='good'?w.lvl+(w.lvl?1:2):w.lvl+(w.lvl?2:3))}
function renderReview(){
  const b=$('#rbody');
  if(R.i>=R.q.length){try{RP&&RP.destroy()}catch(e){}RP=null;b.innerHTML=`<div class="ov-top"><button class="x" data-act="closer">✕</button></div><div class="pad"><div class="card empty"><div class="jp">お疲れさま</div><b style="font-size:18px">Review done</b><p class="muted">${R.n} card${R.n>1?'s':''} reviewed. Come back whenever — there's no streak to keep.</p><button class="btn primary" data-act="closer">Done</button></div></div>`;return}
  const w=R.q[R.i],hasV=!!vById(w.vid);
  const firstRender=!$('#rvid');
  if(firstRender)b.innerHTML=`<div class="ov-top"><button class="x" data-act="closer">✕</button><div class="grow" style="height:8px;border-radius:9px;background:var(--line);overflow:hidden"><i id="rbar" style="display:block;height:100%;background:var(--red)"></i></div><span class="muted" id="rcount" style="font-size:13px;font-weight:700"></span></div>
   <div class="vwrap" id="rvwrap"><div id="rvid"></div></div><div class="pad" id="rcard"></div>`;
  $('#rbar').style.width=(R.i/R.q.length*100)+'%';$('#rcount').textContent=`${R.i+1}/${R.q.length}`;
  $('#rvwrap').style.display=hasV?'':'none';
  $('#rcard').innerHTML=`<div class="rv-card"><div class="muted" style="font-size:13px;font-weight:700">What does this mean?</div>
   <div class="rv-word ${R.shown?'':'nofuri'}">${furi(w.s,w.r)}</div>
   ${R.shown?`<div style="font-size:21px;font-weight:700">${esc(w.note||GLOSS[w.l]||'')}</div>${w.l!==w.s?`<div class="muted">dictionary form <span class="jp">${esc(w.l)}</span></div>`:''}<a href="https://jisho.org/search/${encodeURIComponent(w.l)}" target="_blank" rel="noopener" style="font-size:14px">Jisho ↗</a>`:''}
   <div class="rv-ctx ${S.furi?'':'nofuri'}"><div class="row"><div class="grow muted" style="font-size:12px;font-weight:700">YOU HEARD IT HERE · ${fmt(w.t0)}</div>${hasV?`<button class="tg" data-act="rplay">▶ Replay clip</button>`:''}</div>
    <div class="jpl">${ctxHTML(w)}</div>${R.shown&&w.en?`<div class="enl">${esc(w.en)}</div>`:''}</div></div>
  ${R.shown?`<div class="grades">${[['again','Again','ag'],['hard','Hard',''],['good','Good','gd'],['easy','Easy','']].map(([g,l,c])=>`<button class="${c}" data-act="grade" data-g="${g}">${l}<small>${rel(IV[nextLvl(w,g)]*36e5)}</small></button>`).join('')}</div>`:`<button class="btn primary wide" style="margin-top:12px" data-act="reveal">Show answer</button>`}`;
  if(hasV&&!R.loaded){R.loaded=1;playClip(w)}
}
function ctxHTML(w){
  const v=vById(w.vid);if(v&&v.cues[w.ci]&&v.cues[w.ci].jp===w.line)return lineHTML(w.vid,w.ci,{mark:w.l,hide:R.shown?null:w.l});
  return esc(w.line);
}
function playClip(w){
  const go=()=>{try{RP.loadVideoById({videoId:w.vid,startSeconds:Math.max(0,w.t0-.3),endSeconds:w.t1+.4})}catch(e){}};
  if(RP&&RP.loadVideoById)return go();
  whenYT(()=>{RP=new YT.Player('rvid',{videoId:w.vid,playerVars:{playsinline:1,rel:0,modestbranding:1,start:Math.floor(w.t0),end:Math.ceil(w.t1+.4),cc_load_policy:0},events:{onReady:()=>go()}})});
}
function grade(g){const w=R.q[R.i],l=nextLvl(w,g);w.lvl=l;w.due=Date.now()+IV[l]*36e5;S.saved[w.l]=w;S.reviews++;save();if(g==='again')R.q.push(w);R.i++;R.shown=false;R.loaded=0;renderReview()}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(e.target.id==='sheetbg'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset;
  switch(d.act){
    case 'tab':tab=d.k;render();scrollTo(0,0);break;
    case 'setlevel':S.level=+d.i;save();render();break;
    case 'add':addSheet();break;
    case 'addfor':{const v=P.v;closePlayer();addSheet();$('#f-url').value='https://youtu.be/'+v.id;break}
    case 'flv':document.querySelectorAll('#f-lv button').forEach((b,i)=>b.classList.toggle('on',i===+d.i));break;
    case 'doadd':doAdd();break;
    case 'open':openVideo(d.v);break;
    case 'closep':closePlayer();break;
    case 'delvid':openSheet(`<b style="font-size:18px">Remove this video?</b><p class="muted">Words you saved from it stay in your word bank.</p><div class="row"><button class="btn grow" data-act="nosheet">Cancel</button><button class="btn primary grow" data-act="dodel">Remove</button></div>`);break;
    case 'dodel':{const id=P.v.id;closeSheet();closePlayer();S.videos=S.videos.filter(v=>v.id!==id);save();render();break}
    case 'pp':if(YP&&YP.getPlayerState){P.loopEnd=null;YP.getPlayerState()===1?YP.pauseVideo():YP.playVideo()}break;
    case 'prev':seekCue((P.ci<0?0:P.ci)-1);break;
    case 'next':seekCue((P.ci<0?-1:P.ci)+1);break;
    case 'replay':seekCue(Math.max(0,P.ci),true);break;
    case 'seek':seekCue(+d.i);scrollTo({top:0,behavior:'smooth'});break;
    case 'word':e.stopPropagation();try{YP&&YP.pauseVideo()}catch(_){}wordSheet(d.v,+d.c,+d.t);break;
    case 'savew':saveWord(d.v,+d.c,+d.t);break;
    case 'unsave':delete S.saved[d.k];save();closeSheet();P?renderCaption(true):render();toast('Removed');break;
    case 'resume':closeSheet();try{YP.playVideo()}catch(_){}break;
    case 'savedw':savedSheet(d.k);break;
    case 'watchat':closeSheet();if(R)closeReview();openVideo(d.v,+d.t);break;
    case 'wv':wordsView=d.k;render();break;
    case 'set':S[d.k]=!S[d.k];save();if(P){renderControls();updatePlayBtn()}else render();break;
    case 'rate':S.rate=+d.v;save();try{YP&&YP.setPlaybackRate(S.rate)}catch(_){}renderControls();updatePlayBtn();break;
    case 'nosheet':closeSheet();break;
    case 'export':{const t=JSON.stringify({videos:S.videos,saved:S.saved});(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup copied — paste it somewhere safe'),()=>openSheet(`<b>Copy this backup</b><textarea style="min-height:200px">${esc(t)}</textarea>`));break}
    case 'import':openSheet(`<b style="font-size:18px">Restore from backup</b><textarea id="imp" placeholder="Paste backup text"></textarea><button class="btn primary wide" style="margin-top:10px" data-act="doimport">Restore</button>`);break;
    case 'doimport':try{const j=JSON.parse($('#imp').value);S.videos=j.videos||[];S.saved=j.saved||{};save();closeSheet();render();toast('Restored')}catch(_){toast('That backup text isn\'t valid')}break;
    case 'reset':openSheet(`<b style="font-size:18px">Remove everything?</b><p class="muted">This deletes your videos, saved words and review history in this browser.</p><div class="row"><button class="btn grow" data-act="nosheet">Cancel</button><button class="btn primary grow" data-act="doreset">Reset</button></div>`);break;
    case 'doreset':S={...S,videos:[],saved:{},reviews:0};save();closeSheet();render();break;
    case 'startreview':startReview();break;
    case 'closer':closeReview();break;
    case 'reveal':R.shown=true;renderReview();break;
    case 'rplay':playClip(R.q[R.i]);break;
    case 'grade':grade(d.g);break;
  }
});
document.addEventListener('keydown',e=>{if(!P||$('#sheetbg').classList.contains('open')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key===' '){e.preventDefault();const el=document.querySelector('[data-act=pp]');el&&el.click()}else if(e.key==='ArrowRight')seekCue(P.ci+1);else if(e.key==='ArrowLeft')seekCue(P.ci-1);else if(e.key==='r')seekCue(Math.max(0,P.ci),true)});
render();
setTimeout(()=>{if(S.videos.length)startTokenizer()},1500);
setInterval(()=>{if(!P&&!R)renderTabs()},60000);
</script>
</body>
</html>
