<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#111">
<title>Hibiki — Learn Japanese from real videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f0e4;--card:#fffaf0;--ink:#1f1b16;--muted:#7a6e5e;--line:#e5dac6;--red:#c63d2b;--red-soft:#f6ddd5;--gold:#b8892a;--gold-soft:#f5e6bf;--green:#3f7d4e;--shadow:0 1px 0 rgba(60,40,10,.05),0 6px 18px -8px rgba(60,40,10,.18);--nav:64px}
@media (prefers-color-scheme:dark){:root{--paper:#15120e;--card:#201c17;--ink:#f2eadc;--muted:#a69a87;--line:#352e25;--red:#e2604c;--red-soft:#3a201a;--gold:#d8aa4a;--gold-soft:#3a2f17;--green:#79b884;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);overscroll-behavior:none}
body{font-family:'Zen Kaku Gothic New',system-ui,sans-serif;font-size:16px;line-height:1.45}
.jp{font-family:'Klee One','Hiragino Mincho ProN',serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
input:focus{border-color:var(--gold)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
a{color:var(--red)}
#app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:22px}
.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.wide{width:100%;padding:15px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px env(safe-area-inset-bottom);z-index:5}
body.feedmode nav.tabs{background:rgba(10,10,10,.92);border-top-color:#222}
body.feedmode nav.tabs button{color:#999}body.feedmode nav.tabs button.on{color:#fff}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;color:var(--muted);font-weight:500;position:relative}
nav.tabs .ic{font-size:21px;line-height:1.1;font-family:'Klee One',serif}
nav.tabs button.on{color:var(--red)}
nav.tabs .badge{position:absolute;top:0;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--red);color:#fff}
/* ===== feed ===== */
#feed{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));overflow-y:auto;scroll-snap-type:y mandatory;background:#0b0b0b;color:#fff;display:none;overscroll-behavior:contain}
body.feedmode #feed{display:block}
body.feedmode #app{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;padding:calc(54px + env(safe-area-inset-top)) 0 12px;overflow:hidden}
.slide .bg{position:absolute;inset:-20px;background:#000 center/cover no-repeat;filter:blur(24px) brightness(.35);transform:scale(1.1)}
.slide .stage{position:relative;width:100%;max-width:720px;margin:0 auto;aspect-ratio:16/9;background:#000 center/cover no-repeat;flex:none}
.slide .stage iframe,.slide .stage>div{position:absolute;inset:0;width:100%;height:100%}
.slide .tap{position:absolute;inset:0;display:grid;place-items:center}
.slide .tap span{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;font-size:24px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.slide .info{position:relative;max-width:720px;margin:14px auto 0;padding:0 16px;width:100%}
.slide .src{display:flex;align-items:center;gap:8px;font-size:13px;color:#ccc;font-weight:700}
.slide .ttl{font-size:16px;font-weight:700;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.4em}
.lv{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.slide .lv{background:rgba(216,170,74,.2);color:#e8c06a}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:700;text-decoration:none}
.act .i{font-size:20px;line-height:1}
.act.hot{background:var(--red)}
.hint{font-size:12px;color:#888;text-align:center;margin-top:12px}
.feedtop{position:fixed;top:0;left:0;right:0;z-index:4;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:none;align-items:center;gap:10px;background:linear-gradient(#000c,#0000);pointer-events:none}
body.feedmode .feedtop{display:flex}
.feedtop *{pointer-events:auto}
.feedtop .mark{width:32px;height:32px;font-size:18px;border-radius:10px}
.feedtop b{color:#fff;font-size:16px}
.feedtop .chip{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;margin-left:auto}
.loading{height:100%;display:grid;place-items:center;text-align:center;color:#aaa;padding:30px}
.spin{width:34px;height:34px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#fp{position:fixed;z-index:3;visibility:hidden;background:#000}
body:not(.feedmode) #fp{visibility:hidden!important}
#fp iframe,#fpv{position:absolute;inset:0;width:100%;height:100%;border:0}
#sndbtn{position:absolute;right:10px;top:10px;z-index:2;display:none;align-items:center;gap:6px;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:13px;padding:8px 12px;border-radius:99px;backdrop-filter:blur(6px)}
.slide.short .stage{width:auto;height:calc(100% - 175px);aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden}
.slide.short{justify-content:flex-start}
.shortb{background:#ff0033;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.04em}
/* ===== sheets & pages ===== */
.ov{position:fixed;inset:0;background:var(--paper);z-index:20;display:none;overflow-y:auto}
.ov.open{display:block}
.ov-in{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 0 40px}
.ov-top{display:flex;align-items:center;gap:10px;padding:0 14px 10px}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px;flex:none}
.vwrap{position:relative;background:#000;aspect-ratio:16/9}
.vwrap iframe,.vwrap>div{position:absolute;inset:0;width:100%;height:100%}
.pad{padding:0 14px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.wbig{font-size:44px;font-family:'Klee One',serif;line-height:1.4}
.fact{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--paper);border-radius:12px;border:1px solid var(--line);margin-top:8px}
.fact span:first-child{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding-top:3px}
.kchip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:13px;text-align:left;color:var(--ink);text-decoration:none}
.kchip b{font-family:'Klee One',serif;font-size:22px;width:32px;height:32px;display:grid;place-items:center;background:var(--card);border-radius:8px;font-weight:600}
.fam{margin-bottom:12px}.fam-h{display:flex;align-items:center;gap:14px}
.fam-k{font-family:'Klee One',serif;font-size:42px;width:62px;height:62px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.wrow:first-child{border-top:0}
.wrow .w{font-family:'Klee One',serif;font-size:22px;min-width:70px}
.wrow .src{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seeds{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:26px 14px}.empty .jp{font-size:52px;color:var(--gold)}
.rv-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);text-align:center;margin-top:12px}
.rv-word{font-size:54px;font-family:'Klee One',serif;line-height:1.4}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades button{padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.grades button small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.grades .ag{color:var(--red)}.grades .gd{color:var(--green)}
.tg{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px}.stat small{color:var(--muted);font-size:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:0}
.lvpick{display:grid;gap:10px}
.lvopt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);width:100%}
.lvopt.on{border-color:var(--red);background:var(--red-soft)}
.lvopt .k{font-family:'Klee One',serif;font-size:30px;width:48px;text-align:center}
.srclist{font-size:13px;color:var(--muted);margin-top:4px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="feedtop"><div class="mark jp">響</div><b>Hibiki</b><button class="chip" id="lvchip" data-act="tab" data-k="me"></button></div>
<div id="feed"></div>
<div id="fp"><div id="fpv"></div><button id="sndbtn" data-act="sound">🔇 Tap for sound</button></div>
<div id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="ov" id="review"><div class="ov-in" id="rbody"></div></div>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
/* ================= error reporter ================= */
const APP_VERSION='6';
function showErr(msg){try{let b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#c63d2b;color:#fff;padding:12px 14px;border-radius:14px;font:13px/1.4 system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)';document.body.appendChild(b)}
b.innerHTML='<b>Something went wrong</b> — screenshot this and send it to Claude:<div style="font-family:monospace;margin:6px 0;word-break:break-all">'+String(msg).replace(/</g,'&lt;').slice(0,400)+'</div><button style="background:#fff;color:#c63d2b;border-radius:8px;padding:6px 10px;font-weight:700" onclick="this.parentNode.remove()">Dismiss</button>'}catch(e){}}
window.addEventListener('error',e=>{if(e.message)showErr(e.message+' @'+(e.lineno||'?'))});
window.addEventListener('unhandledrejection',e=>showErr('Promise: '+(e.reason&&e.reason.message||e.reason)));

/* ================= curated sources ================= */
// Each source is a YouTube playlist. For a whole channel we use its uploads playlist ("UU" + channel id without "UC").
const up=ch=>'UU'+ch.slice(2),shorts=ch=>'UUSH'+ch.slice(2);
const CH=[
  {name:'Nihongo no Jikan (Comprehensible Japanese)',id:'UCXo8kuCtqLjL1EH6m4FJJNA',lv:0},
  {name:'Japanese Immersion with Asami',id:'UCIciBLpZ6BP2XNYTFXb6eRQ',lv:0},
  {name:'Say It in Japanese',id:'UCycmtiNAQkMNLFo_IIkWBPQ',lv:0},
  {name:'Easy Japanese Podcast (Masa & Asami)',id:'UC16-9M0osgdFbLKXvCwpXaw',lv:1},
  {name:'Haru no Nihongo',id:'UCauyM-A8JIJ9NQcw5_jF00Q',lv:1},
  {name:'Easy Japanese News',id:'UCQEqRIXGkgK44vae8Ye2s4w',lv:1},
  {name:'ANNnewsCH',id:'UCGCZAYq5Xxojl_tSXcVJhiQ',lv:2},
  {name:'TBS NEWS DIG',id:'UC6AG81pAkf6Lbi_1VC5NmPA',lv:2},
  {name:'YutaNのサブカル流し',id:'UCdtkKDHDbmC-4nWyJZ9ocig',lv:2}
];
const SOURCES=[
  ...CH.map(c=>({name:c.name,list:shorts(c.id),lv:c.lv,short:true})),
  ...CH.map(c=>({name:c.name,list:up(c.id),lv:c.lv})),
  {name:'Nihongo con Teppei (Beginners)',list:'PLbsmSVzhiwvA8VNMAW_cuDqujRQULBjFd',lv:0},
  {name:'Easy Japanese — street interviews',list:'PLA5UIoabheFO87Zs0a2W-5ZMzWBjhg_Ap',lv:1}
];
const LEVELS=[{n:'Beginner',d:'Slow, clear Japanese (around N5–N4)',k:'初',mix:[0,0,0,1]},{n:'Intermediate',d:'Everyday conversations (N3)',k:'中',mix:[1,1,1,0,2]},{n:'Advanced',d:'Native speed: news, podcasts (N2+)',k:'上',mix:[2,2,1]}];

/* ================= state ================= */
const KEY='hibiki-feed-v1';
let S={level:null,saved:{},seen:{},rate:1,reviews:0,lists:{},titles:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S={...S,...s}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){try{S.titles={};localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
const isK=c=>/[一-鿿々〆]/.test(c);
const fmt=t=>{t=Math.max(0,Math.floor(t));const m=Math.floor(t/60),s=t%60;return m+':'+String(s).padStart(2,'0')};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= YouTube API ================= */
let ytReady=false;const ytWait=[];
window.onYouTubeIframeAPIReady=()=>{ytReady=true;ytWait.splice(0).forEach(f=>f())};
(function(){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytFailed=true;if(tab==='watch')renderFeed()};document.head.appendChild(s)})();
let ytFailed=false;
const whenYT=f=>ytReady?f():ytWait.push(f);

/* ================= building the feed ================= */
const DAY=864e5;
function fetchList(src){ // a tiny hidden player reads a playlist's video IDs (no API key needed)
  return new Promise(res=>{
    const c=S.lists[src.list];if(c&&Date.now()-c.t<DAY)return res(c.ids);
    whenYT(()=>{
      const host=document.createElement('div');host.style.cssText='position:fixed;left:-400px;top:0;width:200px;height:120px;opacity:0;pointer-events:none';
      const el=document.createElement('div');host.appendChild(el);document.body.appendChild(host);
      let done=false,p;
      const finish=ids=>{if(done)return;done=true;try{p.destroy()}catch(e){}host.remove();
        if(ids){S.lists[src.list]={t:Date.now(),ids:ids.slice(0,120)};save();res(S.lists[src.list].ids)}else res(c?c.ids:[])};
      setTimeout(()=>finish(null),9000);
      p=new YT.Player(el,{width:200,height:120,playerVars:{listType:'playlist',list:src.list,autoplay:0,mute:1},
        events:{onReady:()=>{let n=0;const iv=setInterval(()=>{n++;let ids=null;try{ids=p.getPlaylist()}catch(e){}if(ids&&ids.length){clearInterval(iv);finish(ids)}else if(n>16){clearInterval(iv);finish([])}},300)},
          onError:()=>finish([])}});
    });
  });
}
let FEED=[],feedState='idle',active=-1,FP=null,feedBuilt=false;
async function buildFeed(){
  if(feedState==='loading')return;feedState='loading';renderFeed();
  const srcs=SOURCES.filter(s=>LEVELS[S.level].mix.includes(s.lv));
  const order=[...srcs.filter(s=>s.short),...srcs.filter(s=>!s.short)]; // shorts first so the feed starts fast and snappy
  const lists=[];
  for(let k=0;k<order.length;k+=2){ // two at a time
    const got=await Promise.all(order.slice(k,k+2).map(fetchList));
    got.forEach((ids,j)=>{if(ids.length)lists.push({s:order[k+j],ids:shuffle(ids.filter(id=>!S.seen[id])).concat(shuffle(ids.filter(id=>S.seen[id])))})});
    if(lists.length&&!FEED.length){FEED=interleave(lists);feedState='partial';renderFeed()}
  }
  const all=interleave(lists);
  if(!FEED.length){FEED=all;feedState=all.length?'ready':'empty';renderFeed();return}
  const keep=Math.min(FEED.length,Math.max(active,0)+3),head=FEED.slice(0,keep),have=new Set(head.map(x=>x.id));
  FEED=head.concat(all.filter(x=>!have.has(x.id)));feedState='ready';
  const f=$('#feed');f.querySelectorAll('.slide').forEach(el=>{if(+el.dataset.i>=keep)el.remove()});
  f.insertAdjacentHTML('beforeend',FEED.slice(keep).map((it,j)=>slideHTML(it,keep+j)).join(''));
}
function interleave(lists){
  const w=LEVELS[S.level].mix,out=[],idx=lists.map(()=>0),seen=new Set();
  const weight=lists.map(l=>w.filter(x=>x===l.s.lv).length/Math.max(1,lists.filter(m=>m.s.lv===l.s.lv).length)*(l.s.short?1.5:1));
  let guard=0;
  while(out.length<400&&guard++<5000){
    let any=false;
    lists.forEach((l,i)=>{const take=Math.max(1,Math.round(weight[i]*2));for(let k=0;k<take;k++){if(idx[i]<l.ids.length){const id=l.ids[idx[i]++];if(!seen.has(id)){seen.add(id);out.push({id,src:l.s,short:!!l.s.short})}any=true}}});
    if(!any)break;
  }
  for(let i=0;i<out.length;i+=6){const part=shuffle(out.slice(i,i+6));out.splice(i,part.length,...part)}
  return out;
}
const thumb=it=>`https://i.ytimg.com/vi/${it.id}/${it.short?'oar2':'hqdefault'}.jpg`;
function slideHTML(it,i){
  return `<section class="slide ${it.short?'short':''}" data-i="${i}"><div class="bg" style="background-image:url(https://i.ytimg.com/vi/${it.id}/hqdefault.jpg)"></div>
  <div class="stage" id="st${i}" style="background-image:url(https://i.ytimg.com/vi/${it.id}/hqdefault.jpg)"></div>
  <div class="info"><div class="src"><span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.short?'<span class="shortb">Shorts</span> ':''}${esc(it.src.name)}</span><span class="lv">${LEVELS[it.src.lv].n}</span></div>
   <div class="ttl" id="tt${i}">${esc(S.titles[it.id]||'')}</div>
   <div class="acts"><button class="act hot" data-act="saveword" data-i="${i}"><span class="i">＋</span>Save word</button><button class="act" data-act="back5" data-i="${i}"><span class="i">↺</span>Back 5s</button><button class="act" data-act="slow" data-i="${i}"><span class="i">🐢</span><span class="rl">${S.rate===1?'Slower':S.rate+'×'}</span></button><a class="act" href="https://www.youtube.com/${it.short?'shorts/':'watch?v='}${it.id}" target="_blank" rel="noopener"><span class="i">↗</span>YouTube</a></div>
   ${i===0?`<div class="hint">Swipe up for the next video</div>`:''}</div></section>`;

function renderFeed(){
  const f=$('#feed');

  if(ytFailed){hidePlayer();f.innerHTML=`<div class="loading"><div><b style="color:#fff">Can't reach YouTube</b><p>Check your internet connection, then try again.</p><button class="act" style="display:inline-flex;padding:10px 16px" data-act="retry">Retry</button></div></div>`;return}
  if(!FEED.length){hidePlayer();f.innerHTML=`<div class="loading"><div><div class="spin"></div>${feedState==='empty'?'<b style="color:#fff">No videos found</b><p>The channels may be temporarily unavailable.</p><button class="act" style="display:inline-flex;padding:10px 16px" data-act="retry">Try again</button>':'Finding Japanese videos for your level…'}</div></div>`;return}

/* --- the single player: sits on top of the active slide and switches videos as you swipe --- */
let PL=null,plReady=false,soundOn=/; wv\)|\bwv\b/.test(navigator.userAgent),scrollT=null,lastTop=0;
function stageRect(i){const st=$('#st'+i);return st?st.getBoundingClientRect():null}
function placePlayer(i){
  const r=stageRect(i),box=$('#fp');if(!r||!box)return;
  Object.assign(box.style,{top:r.top+'px',left:r.left+'px',width:r.width+'px',height:r.height+'px',visibility:'visible'});
}
function hidePlayer(){const box=$('#fp');if(box)box.style.visibility='hidden';try{PL&&plReady&&PL.pauseVideo()}catch(e){}}
function onFeedScroll(){
  const f=$('#feed');
  if(Math.abs(f.scrollTop-lastTop)>8&&active>=0){$('#fp').style.visibility='hidden'}
  clearTimeout(scrollT);scrollT=setTimeout(settle,130);
}
function settle(){
  const f=$('#feed');if(!f.clientHeight||!FEED.length||tab!=='watch')return;
  lastTop=f.scrollTop;const i=Math.round(f.scrollTop/f.clientHeight);
  if(i===active){placePlayer(i);try{plReady&&PL.playVideo()}catch(e){}return}
  activate(i);
  if(i>FEED.length-6&&feedState==='ready'&&FEED.length<400){} // feed is long; nothing to do
}
function activate(i){
  if(i<0||i>=FEED.length)return;
  active=i;const it=FEED[i];loadTitles(i);
  placePlayer(i);updateSoundBtn();
  whenYT(()=>{
    if(active!==i)return;
    if(!PL){
      PL=new YT.Player('fpv',{videoId:it.id,playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,modestbranding:1,cc_load_policy:1,cc_lang_pref:'ja',hl:'ja',iv_load_policy:3,fs:1},
        events:{onReady:()=>{plReady=true;try{PL.setPlaybackRate(S.rate)}catch(e){}applySound();PL.playVideo();FP={i:active,p:PL}},
          onStateChange:onPlState,onError:()=>{toast('Skipping a video that can\'t play here');setTimeout(nextSlide,700)}}});
    }else if(plReady){
      try{PL.loadVideoById({videoId:it.id,startSeconds:0});PL.setPlaybackRate(S.rate)}catch(e){}
      applySound();FP={i,p:PL};
    }
  });
}
function onPlState(e){
  const it=FEED[active];if(!it)return;
  if(e.data===1){if(!S.seen[it.id]){S.seen[it.id]=Date.now();save()}const d=PL.getVideoData&&PL.getVideoData();if(d&&d.title&&!S.titles[it.id]){S.titles[it.id]=d.title;const t=$('#tt'+active);if(t)t.textContent=d.title}}
  if(e.data===0)nextSlide();
  updateSoundBtn();
}
function applySound(){
  try{if(soundOn){PL.unMute();PL.setVolume(100)}else PL.mute()}catch(e){}
  // if the phone blocked playback with sound, fall back to muted so it still plays
  const i=active;setTimeout(()=>{try{if(active===i&&PL.getPlayerState()!==1&&PL.getPlayerState()!==3&&!PL.isMuted()){PL.mute();PL.playVideo();soundOn=false}}catch(e){}updateSoundBtn()},1600);
  updateSoundBtn();
}
function updateSoundBtn(){const b=$('#sndbtn');if(!b)return;let muted=!soundOn;try{if(plReady)muted=PL.isMuted()}catch(e){}b.style.display=muted?'flex':'none'}
function nextSlide(){const f=$('#feed');if(active<FEED.length-1)f.scrollTo({top:(active+1)*f.clientHeight,behavior:'smooth'})}
function loadTitles(i){for(let k=i;k<Math.min(FEED.length,i+3);k++){const id=FEED[k].id;if(S.titles[id])continue;fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.title){S.titles[id]=j.title;const t=$('#tt'+k);if(t)t.textContent=j.title}}).catch(()=>{})}}
const fpTime=()=>{try{return plReady?PL.getCurrentTime():0}catch(e){return 0}};
window.addEventListener('resize',()=>{if(tab==='watch'&&active>=0)placePlayer(active)});
/* ================= tabs ================= */
let tab='watch',wordsView='fam';
const TABS=[['watch','映','Watch'],['review','復','Review'],['words','字','Words'],['me','私','Me']];
const due=()=>Object.values(S.saved).filter(w=>w.due<=Date.now());
function renderTabs(){const d=due().length;$('#tabs').innerHTML=TABS.map(([k,ic,l])=>`<button class="${tab===k?'on':''}" data-act="tab" data-k="${k}"><span class="ic">${ic}</span>${l}${k==='review'&&d?`<span class="badge">${d}</span>`:''}</button>`).join('')}
function header(){return `<header class="top"><div class="brand"><div class="mark jp">響</div><div><b>Hibiki</b><small>Learn Japanese from real videos</small></div></div></header>`}
function render(){
  renderTabs();
  const feedmode=S.level!==null&&tab==='watch';
  document.body.classList.toggle('feedmode',feedmode);
  if(feedmode){if(!feedBuilt){feedBuilt=true;buildFeed()}else if(!FEED.length)renderFeed();else requestAnimationFrame(()=>{if(active>=0){placePlayer(active);try{plReady&&PL.playVideo()}catch(e){}}else settle()});return}
  hidePlayer();
  $('#app').innerHTML=header()+(S.level===null?onboardV():({review:reviewV,words:wordsV,me:meV})[tab]());
}
function onboardV(){
  return `<div class="card" style="text-align:center;padding:22px 18px"><div class="jp" style="font-size:52px;color:var(--red)">ようこそ</div><b style="font-size:20px">Welcome to Hibiki</b>

  <h2>What's your level?</h2><div class="lvpick">${LEVELS.map((l,i)=>`<button class="lvopt" data-act="setlevel" data-i="${i}"><span class="k">${l.k}</span><span class="grow"><b>${l.n}</b><div class="muted" style="font-size:14px">${l.d}</div></span><span>→</span></button>`).join('')}</div>`;
}
function reviewV(){
  const d=due(),all=Object.values(S.saved);
  const next=all.map(w=>w.due).filter(t=>t>Date.now()).sort((a,b)=>a-b)[0];
  if(!all.length)return `<div class="card empty"><div class="jp">復習</div><b>No words saved yet</b><p class="muted">While watching, tap <b>＋ Save word</b> when you hear something you want to remember. It comes back here with the few seconds of video where you heard it.</p><button class="btn primary" data-act="tab" data-k="watch">Start watching</button></div>`;
  return d.length?`<button class="card" style="width:100%;text-align:left;background:var(--red);color:#fff;border:0" data-act="startreview"><div style="font-size:44px;font-weight:700;line-height:1">${d.length}</div><div style="opacity:.85">word${d.length>1?'s':''} ready — each replays its clip</div><div style="margin-top:10px;font-weight:700">Start review →</div></button>`
  :`<div class="card empty"><div class="jp">鈴</div><b>Nothing due right now</b><p class="muted">${next?'Next card in '+rel(next-Date.now())+'. ':''}Words come back just before you're likely to forget them.</p></div>`;
}
function rel(ms){const m=ms/6e4;if(m<60)return Math.max(1,Math.round(m))+' min';const h=m/60;if(h<24)return Math.round(h)+' h';const d=Math.round(h/24);return d+(d===1?' day':' days')}
function families(){const f={};Object.values(S.saved).forEach(w=>[...new Set([...w.l].filter(isK))].forEach(k=>(f[k]=f[k]||[]).push(w)));return Object.entries(f).sort((a,b)=>b[1].length-a[1].length)}
function wordRow(w){return `<button class="wrow" data-act="savedw" data-k="${esc(w.l)}"><span class="w">${esc(w.l)}</span><span class="grow"><div>${esc(w.note||'—')}</div><div class="src">▶ ${esc(w.title||w.srcName||'video')} · ${fmt(w.t0)}</div></span><span class="muted">›</span></button>`}
function wordsV(){
  const all=Object.values(S.saved);
  const seg=`<div class="seg"><button class="${wordsView==='fam'?'on':''}" data-act="wv" data-k="fam">Kanji families</button><button class="${wordsView==='all'?'on':''}" data-act="wv" data-k="all">All words (${all.length})</button></div>`;
  if(!all.length)return seg+`<div class="card empty" style="margin-top:14px"><div class="jp">字</div><b>Your word bank is empty</b><p class="muted">Save words while you watch. Words that share a kanji, like 電車 and 電話, group into a family here.</p></div>`;
  if(wordsView==='all')return seg+`<div class="card" style="margin-top:14px;padding:6px 16px">${all.sort((a,b)=>b.added-a.added).map(wordRow).join('')}</div>`;

  <h2>Your data</h2><div class="card" style="padding:4px 16px">

/* ================= saving words ================= */
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheetbg').classList.add('open')}
function closeSheet(){$('#sheetbg').classList.remove('open')}
let pendingSave=null;
function saveWordSheet(i){
  const it=FEED[i],t=FP&&FP.i===i?fpTime():0;
  try{FP&&FP.i===i&&FP.p.pauseVideo()}catch(e){}
  pendingSave={it,t};
  openSheet(`<b style="font-size:19px">Save a word from this clip</b>
  <div class="muted" style="font-size:14px;margin-top:2px">${t?`At ${fmt(t)} — the review card will replay this moment.`:'Start the video first to save the exact moment.'}</div>
  <label>Word you heard or saw in the captions</label><input id="sw-word" class="jp" style="font-size:22px" placeholder="例: 電車" autocomplete="off" lang="ja">
  <div class="row" style="margin-top:8px"><a class="btn grow" id="sw-jisho" href="https://jisho.org" target="_blank" rel="noopener">📖 Look it up on Jisho ↗</a></div>
  <label>Meaning (optional)</label><input id="sw-note" placeholder="e.g. train" autocomplete="off">
  <button class="btn primary wide" style="margin-top:14px" data-act="dosave">Save word</button>
  <button class="btn wide" style="margin-top:8px" data-act="resumefeed">Keep watching</button>`);
  const w=$('#sw-word');w.addEventListener('input',()=>{$('#sw-jisho').href='https://jisho.org/search/'+encodeURIComponent(w.value.trim())});

}
function doSave(){
  const word=$('#sw-word').value.trim();if(!word){toast('Type the word first');return}
  const {it,t}=pendingSave,note=$('#sw-note').value.trim(),ex=S.saved[word];
  S.saved[word]={...(ex||{lvl:0,due:Date.now(),added:Date.now()}),l:word,note:note||(ex&&ex.note)||'',vid:it.id,t0:Math.max(0,t-4),t1:t+1.5,title:S.titles[it.id]||'',srcName:it.src.name};
  const grew=!ex&&[...new Set([...word].filter(isK))].find(k=>Object.values(S.saved).filter(w=>w.l.includes(k)).length===2);
  save();closeSheet();renderTabs();toast(grew?`New kanji family: ${grew} 🎉`:ex?'Updated':'Saved — it\'ll come back in Review');
  try{FP&&FP.p.playVideo()}catch(e){}

function savedSheet(k){
  const w=S.saved[k];if(!w)return;const kanji=[...new Set([...w.l].filter(isK))];

  <a class="btn wide" style="margin-top:10px" href="https://jisho.org/search/${encodeURIComponent(w.l)}" target="_blank" rel="noopener">📖 Jisho ↗</a>
  <button class="btn primary wide" style="margin-top:8px" data-act="playclip" data-k="${esc(w.l)}">▶ Replay the clip</button>
  <button class="btn wide" style="margin-top:8px;color:var(--red)" data-act="unsave" data-k="${esc(w.l)}">Remove</button>`);
}

/* ================= review with clip replay ================= */
const IV=[10/60,4,24,72,168,336,720,2160,4320];
let R=null,RP=null;
function startReview(single){
  const q=single?[S.saved[single]]:due().sort(()=>Math.random()-.5);if(!q.length)return;
  hidePlayer();
  R={q,i:0,shown:!!single,n:q.length,single:!!single};$('#review').classList.add('open');renderReview();
}
function closeReview(){try{RP&&RP.destroy()}catch(e){}RP=null;R=null;$('#review').classList.remove('open');render()}
function nextLvl(w,g){return Math.min(8,g==='again'?0:g==='hard'?Math.max(1,w.lvl):g==='good'?w.lvl+(w.lvl?1:2):w.lvl+(w.lvl?2:3))}
function renderReview(){
  const b=$('#rbody');
  if(R.i>=R.q.length){try{RP&&RP.destroy()}catch(e){}RP=null;b.innerHTML=`<div class="ov-top"><button class="x" data-act="closer">✕</button></div><div class="pad"><div class="card empty"><div class="jp">お疲れさま</div><b style="font-size:18px">Review done</b><p class="muted">${R.n} card${R.n>1?'s':''} reviewed. Come back whenever — there's no streak to keep.</p><button class="btn primary" data-act="closer">Done</button></div></div>`;return}
  const w=R.q[R.i];
  if(!$('#rvid')){b.innerHTML=`<div class="ov-top"><button class="x" data-act="closer">✕</button><div class="grow" style="height:8px;border-radius:9px;background:var(--line);overflow:hidden"><i id="rbar" style="display:block;height:100%;background:var(--red)"></i></div><span class="muted" id="rcount" style="font-size:13px;font-weight:700"></span></div><div class="vwrap"><div id="rvid"></div></div><div class="pad" id="rcard"></div>`}
  $('#rbar').style.width=(R.i/R.q.length*100)+'%';$('#rcount').textContent=`${R.i+1}/${R.q.length}`;
  $('#rcard').innerHTML=`<div class="rv-card"><div class="muted" style="font-size:13px;font-weight:700">${R.single?'Your word':'Listen to the clip — what does this mean?'}</div>
   <div class="rv-word">${esc(w.l)}</div>
   ${R.shown?`<div style="font-size:21px;font-weight:700">${esc(w.note||'(no meaning saved)')}</div><a href="https://jisho.org/search/${encodeURIComponent(w.l)}" target="_blank" rel="noopener" style="font-size:14px">Jisho ↗</a>`:''}
   <div class="muted" style="font-size:13px;margin-top:10px">${esc(w.title||w.srcName)} · ${fmt(w.t0)}</div>
   <button class="tg" style="margin-top:10px" data-act="rplay">▶ Replay clip</button></div>
  ${R.single?'':R.shown?`<div class="grades">${[['again','Again','ag'],['hard','Hard',''],['good','Good','gd'],['easy','Easy','']].map(([g,l,c])=>`<button class="${c}" data-act="grade" data-g="${g}">${l}<small>${rel(IV[nextLvl(w,g)]*36e5)}</small></button>`).join('')}</div>`:`<button class="btn primary wide" style="margin-top:12px" data-act="reveal">Show answer</button>`}`;
  if(!R.loaded){R.loaded=1;playClip(w)}
}
function playClip(w){
  const go=()=>{try{RP.loadVideoById({videoId:w.vid,startSeconds:w.t0,endSeconds:w.t1})}catch(e){}};
  if(RP&&RP.loadVideoById)return go();
  whenYT(()=>{RP=new YT.Player('rvid',{videoId:w.vid,playerVars:{playsinline:1,rel:0,modestbranding:1,start:Math.floor(w.t0),end:Math.ceil(w.t1),cc_load_policy:1,cc_lang_pref:'ja',hl:'ja'},events:{onReady:()=>go()}})});
}
function grade(g){const w=R.q[R.i],l=nextLvl(w,g);w.lvl=l;w.due=Date.now()+IV[l]*36e5;S.saved[w.l]=w;S.reviews++;save();if(g==='again')R.q.push(w);R.i++;R.shown=false;R.loaded=0;renderReview()}

/* ================= events ================= */
$('#feed').addEventListener('scroll',onFeedScroll,{passive:true});
document.addEventListener('click',e=>{
  if(e.target.id==='sheetbg'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(!el)return;const d=el.dataset;
  switch(d.act){
    case 'tab':tab=d.k;render();scrollTo(0,0);break;
    case 'setlevel':{const changed=S.level!==+d.i;S.level=+d.i;save();if(changed){FEED=[];feedBuilt=false;feedState='idle';hidePlayer();active=-1}tab='watch';render();break}
    case 'sound':soundOn=true;try{PL.unMute();PL.setVolume(100);PL.playVideo()}catch(_){}updateSoundBtn();break;
    case 'saveword':saveWordSheet(+d.i);break;
    case 'back5':if(FP&&FP.i===+d.i){try{FP.p.seekTo(Math.max(0,fpTime()-5),true);FP.p.playVideo()}catch(_){}}break;
    case 'slow':S.rate=S.rate===1?.75:S.rate===.75?.5:1;save();document.querySelectorAll('.act .rl').forEach(x=>x.textContent=S.rate===1?'Slower':S.rate+'×');try{FP&&FP.p.setPlaybackRate(S.rate)}catch(_){}toast('Speed '+S.rate+'×');break;
    case 'dosave':doSave();break;
    case 'resumefeed':closeSheet();try{FP&&FP.p.playVideo()}catch(_){}break;
    case 'retry':ytFailed=false;FEED=[];feedState='idle';S.lists={};buildFeed();break;
    case 'refresh':S.lists={};save();FEED=[];feedBuilt=false;hidePlayer();active=-1;feedState='idle';tab='watch';render();toast('Getting fresh videos…');break;
    case 'savedw':savedSheet(d.k);break;
    case 'playclip':closeSheet();startReview(d.k);break;
    case 'unsave':delete S.saved[d.k];save();closeSheet();render();toast('Removed');break;
    case 'wv':wordsView=d.k;render();break;
    case 'nosheet':closeSheet();break;
    case 'export':{const t=JSON.stringify({saved:S.saved});(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup copied — paste it somewhere safe'),()=>openSheet(`<b>Copy this backup</b><textarea style="width:100%;min-height:200px">${esc(t)}</textarea>`));break}
    case 'import':openSheet(`<b style="font-size:18px">Restore from backup</b><textarea id="imp" style="width:100%;min-height:140px;margin-top:10px" placeholder="Paste backup text"></textarea><button class="btn primary wide" style="margin-top:10px" data-act="doimport">Restore</button>`);break;
    case 'doimport':try{const j=JSON.parse($('#imp').value);S.saved=j.saved||{};save();closeSheet();render();toast('Restored')}catch(_){toast('That backup text isn\'t valid')}break;
    case 'reset':openSheet(`<b style="font-size:18px">Remove everything?</b><p class="muted">This deletes your saved words and watch history on this device.</p><div class="row"><button class="btn grow" data-act="nosheet">Cancel</button><button class="btn primary grow" data-act="doreset">Reset</button></div>`);break;
    case 'doreset':S={...S,saved:{},seen:{},reviews:0};save();closeSheet();render();break;
    case 'startreview':startReview();break;
    case 'closer':closeReview();break;
    case 'reveal':R.shown=true;renderReview();break;
    case 'rplay':playClip(R.q[R.i]);break;
    case 'grade':grade(d.g);break;
  }
});
document.addEventListener('keydown',e=>{if(tab!=='watch'||$('#sheetbg').classList.contains('open')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;const f=$('#feed');if(e.key==='ArrowDown'){e.preventDefault();f.scrollBy({top:f.clientHeight,behavior:'smooth'})}else if(e.key==='ArrowUp'){e.preventDefault();f.scrollBy({top:-f.clientHeight,behavior:'smooth'})}});
window.hibikiBack=()=>{if($('#sheetbg').classList.contains('open')){closeSheet();return true}if(R){closeReview();return true}if(tab!=='watch'&&S.level!==null){tab='watch';render();return true}return false};
render();
setInterval(()=>{if(!R)renderTabs()},60000);
</script>
</body>
</html>
